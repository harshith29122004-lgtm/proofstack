name: Bug report
description: Report a reproducible problem in ProofStack.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include private documents, personal data, credentials, or confidential workspace content."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start ProofStack. 2. Use a synthetic sample. 3. Search."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version, operating system, and browser.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, personal paths, and document contents.
    validations:
      required: false
